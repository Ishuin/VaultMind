# Nginx configuration for the ThoughtWeb Navigator React SPA
# This file is mounted into Nginx as a virtual-host config.

server {
    # Listen on port 80 inside the container (matches the EXPOSE in Dockerfile).
    listen 80;

    # server_name is the hostname Nginx answers to.
    # "_" is a wildcard that catches any hostname, suitable for Docker.
    server_name _;

    # Root directory where Nginx looks for static files.
    # Matches the COPY destination in the Dockerfile.
    root /usr/share/nginx/html;

    # The default file to serve when a directory is requested.
    index index.html;

    # Enable gzip compression for text-based assets.
    # Reduces transfer size for JS/CSS/HTML by ~70%.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA fallback: for any URL that does NOT map to a real file or directory,
    # serve index.html instead of returning 404.
    # This allows React Router to handle the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively.
    # Vite appends content hashes to filenames (e.g., main.abc123.js),
    # so it's safe to cache them for a long time (1 year).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the FastAPI backend.
    # Any request starting with /api/ is forwarded to the backend service.
    # This avoids CORS issues in production by routing through the same origin.
    location /api/ {
        # "backend" is the service name defined in docker-compose.yml.
        # Docker's internal DNS resolves it to the correct container IP.
        proxy_pass http://backend:8000;

        # Forward the original Host header so the backend knows the real host.
        proxy_set_header Host $host;

        # Forward the real client IP; otherwise the backend always sees the
        # proxy IP (Nginx container IP) instead of the actual user's IP.
        proxy_set_header X-Real-IP $remote_addr;

        # Standard header to pass the full chain of proxies.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tell the backend the original protocol (http/https).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
