version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: thoughtweb_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: thoughtweb_navigator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
