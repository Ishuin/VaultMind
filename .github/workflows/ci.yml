name: CI

on:
  push:
    branches: [bridge]
  pull_request:
    branches: [bridge]

jobs:
  backend:
    name: Backend (pytest + eval gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vaultmind_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5433/vaultmind_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend_fastapi/requirements.txt

      - name: Cache HuggingFace model (retrieval eval)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ hashFiles('backend_fastapi/requirements.txt') }}

      - name: Install dependencies
        working-directory: backend_fastapi
        run: pip install -r requirements.txt

      - name: Apply migrations to fresh database
        working-directory: backend_fastapi
        run: python -m alembic upgrade head

      - name: Schema drift check (models vs migrations)
        working-directory: backend_fastapi
        run: python -m alembic check

      - name: Tests
        working-directory: backend_fastapi
        run: python -m pytest -q

      - name: Retrieval eval gate
        working-directory: backend_fastapi
        run: python -m app.eval.retrieval_eval

  frontend:
    name: Frontend (lint baseline, build, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 required: undici@8 (via jsdom 30) crashes on Node 20 at module load
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (fails only above the 19-error baseline)
        run: |
          npx eslint . -f json -o eslint-report.json || true
          node scripts/check-lint-baseline.mjs

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
